# /etc/nginx/conf.d/netbox.conf — [2단계: 실제 운영] https://ipam.inha.ac.kr:18000
#   시범 운영(nginx-netbox-pilot.conf)을 이 파일로 바꾸면 같은 18000 포트가 HTTPS 가 된다
#   ipam.inha.ac.kr 을 실제 서버 이름으로, 인증서 경로를 실제 파일로 바꾼다
#   확인: sudo nginx -t && sudo systemctl reload nginx
#   443(포트 번호 없는 주소)도 쓰려면 아래 두 번째 server 블록의 주석을 푼다
server {
    listen 18000 ssl;
    server_name ipam.inha.ac.kr;

    ssl_certificate     /etc/pki/nginx/ipam.crt;          # 기관 인증서(체인 포함)
    ssl_certificate_key /etc/pki/nginx/private/ipam.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    # 같은 포트로 http:// 로 들어오면 https:// 로 돌려보냄 (nginx 497 = HTTP 요청이 HTTPS 포트로 옴)
    error_page 497 =301 https://$host:18000$request_uri;

    # 시범 운영 때처럼 접속 IP 를 제한하려면 다음 두 줄을 남기고, 전체 사용자에게 열 때 지운다
    include /etc/nginx/netbox-allow.inc;
    deny all;

    client_max_body_size 25m;
    proxy_read_timeout 300s;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;    # https → NetBox·SSO 가 https 주소로 응답
    }
}

