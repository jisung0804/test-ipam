# /etc/nginx/conf.d/netbox.conf — NetBox 앞단 HTTPS 프록시
#   ipam.inha.ac.kr 을 실제 서버 이름으로, 인증서 경로를 실제 파일로 바꾼다
#   확인: sudo nginx -t && sudo systemctl reload nginx
server {
    listen 80;
    server_name ipam.inha.ac.kr;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name ipam.inha.ac.kr;

    ssl_certificate     /etc/pki/nginx/ipam.crt;          # 기관 인증서(체인 포함) 또는 자체 서명 인증서
    ssl_certificate_key /etc/pki/nginx/private/ipam.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 25m;     # 엑셀 업로드 (NetBox 설정 FILE_UPLOAD_MAX_MEMORY_SIZE 20MB 보다 크게)
    proxy_read_timeout 300s;      # 큰 엑셀 처리·리포트 대기

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
