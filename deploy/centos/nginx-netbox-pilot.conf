# /etc/nginx/conf.d/netbox.conf — [1단계: 시범 운영] http://<서버IP>:18000
#   관리자 PC 에서만 접속: firewalld(서버 방화벽) + 아래 allow 목록으로 이중 제한
#   NetBox 컨테이너는 127.0.0.1:8000 에만 열려 있고, 외부는 이 nginx(18000)만 통과한다
#   pilot_setup.sh 가 이 파일과 /etc/nginx/netbox-allow.inc 를 설치한다
server {
    listen 18000;
    server_name _;

    include /etc/nginx/netbox-allow.inc;   # allow <관리자IP>; … (pilot_setup.sh 가 작성)
    deny all;

    client_max_body_size 25m;              # 엑셀 업로드
    proxy_read_timeout 300s;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $http_host;              # :18000 포함 → NetBox CSRF 검사와 맞음
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
